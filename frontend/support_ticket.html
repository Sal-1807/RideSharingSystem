<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support – RideShare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-brand">
        <h2>RideShare</h2>
        <p id="nav-user-name"></p>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
        <!-- populated by JS based on user type -->
    </nav>
    <div class="sidebar-footer">
        <button onclick="logout()" class="sidebar-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
        </button>
    </div>
</aside>

<main class="main-content">
    <div class="main-header">
        <h1>Support Center</h1>
        <p>Raise a ticket for any issue and our team will resolve it.</p>
    </div>

    <div id="alert-box" class="alert"></div>

    <div class="grid-2">

        <!-- Ticket Form -->
        <div class="card">
            <div class="card-title">Raise a Support Ticket</div>

            <form id="ticket-form" onsubmit="submitTicket(event)">
                <div class="form-group">
                    <label>Issue Category</label>
                    <select id="category" class="no-icon">
                        <!-- populated by buildCategories() based on user type -->
                    </select>
                </div>

                <div class="form-group">
                    <label>Describe Your Issue</label>
                    <textarea id="description" rows="5" placeholder="Please describe your issue in detail…" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
                    Submit Ticket
                </button>
            </form>

            <div id="success-msg" class="alert alert-success hidden" style="margin-top:16px">
                Ticket raised successfully! Our team will contact you soon.
                <br><strong>Ticket ID: <span id="ticket-id">—</span></strong>
            </div>
        </div>

        <!-- My Tickets -->
        <div class="card">
            <div class="card-title">My Tickets</div>
            <div id="tickets-list">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </div>
</main>

<script src="js/api.js"></script>
<script>
    const user = requireAuth(['passenger', 'driver']);

    if (user) {
        populateNav(user);
        buildSidebar(user.user_type);
        buildCategories(user.user_type);
        loadTickets();
    }

    function buildCategories(type) {
        const passengerOptions = [
            'Driver arrived late',
            'Incorrect fare charged',
            'Payment not processed',
            'Driver behaviour',
            'App / Technical issue',
            'Other'
        ];
        const driverOptions = [
            'Passenger did not show up',
            'Passenger behaviour / misconduct',
            'Passenger requested route change mid-trip',
            'Passenger left items in vehicle',
            'Incorrect fare dispute by passenger',
            'Payment not received',
            'App / Technical issue',
            'Other'
        ];
        const options = type === 'driver' ? driverOptions : passengerOptions;
        const select = document.getElementById('category');
        select.innerHTML = options.map(o => `<option value="${o}">${o}</option>`).join('');
    }

    function buildSidebar(type) {
        const nav = document.getElementById('sidebar-nav');
        const svgHome = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`;
        const svgCar  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>`;
        const svgClock= `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
        const svgCard = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>`;
        const svgStar = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
        const svgHelp = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;

        if (type === 'passenger') {
            nav.innerHTML = `
                <a href="passenger_dashboard.html" class="sidebar-link">${svgHome} Dashboard</a>
                <a href="request_ride.html" class="sidebar-link">${svgCar} Book Ride</a>
                <a href="trip_history.html" class="sidebar-link">${svgClock} Trip History</a>
                <a href="payment.html" class="sidebar-link">${svgCard} Payments</a>
                <a href="rating.html" class="sidebar-link">${svgStar} Rate Driver</a>
                <a href="support_ticket.html" class="sidebar-link active">${svgHelp} Support</a>
            `;
        } else {
            nav.innerHTML = `
                <a href="driver_dashboard.html" class="sidebar-link">${svgHome} Dashboard</a>
                <a href="support_ticket.html" class="sidebar-link active">${svgHelp} Support</a>
            `;
        }
    }

    async function submitTicket(e) {
        e.preventDefault();
        const category    = document.getElementById('category').value;
        const description = document.getElementById('description').value.trim();
        const btn         = document.getElementById('submit-btn');

        if (!description) return showAlert('Please describe your issue', 'error');

        btn.textContent = 'Submitting…';
        btn.disabled = true;

        try {
            const data = await API.support.raise({
                user_id:           user.id,
                user_type:         user.user_type === 'passenger' ? 'Passenger' : 'Driver',
                issue_description: `[${category}] ${description}`
            });

            document.getElementById('ticket-id').textContent = data.ticket_id;
            document.getElementById('success-msg').classList.remove('hidden');
            document.getElementById('ticket-form').reset();
            loadTickets();

        } catch (err) {
            showAlert(err.message, 'error');
        } finally {
            btn.textContent = 'Submit Ticket';
            btn.disabled = false;
        }
    }

    async function loadTickets() {
        try {
            const userType = user.user_type === 'passenger' ? 'Passenger' : 'Driver';
            const tickets  = await API.support.my(user.id, userType);
            const list     = document.getElementById('tickets-list');

            if (!tickets.length) {
                list.innerHTML = '<div class="empty-state"><div class="icon">🎫</div><p>No tickets raised yet.</p></div>';
                return;
            }

            list.innerHTML = tickets.map(t => `
                <div style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;">
                    <div class="flex-between mb-8">
                        <strong>#${t.Ticket_ID}</strong>
                        ${statusBadge(t.Status)}
                    </div>
                    <p style="font-size:.88rem;color:var(--text)">${t.Issue_Description}</p>
                    <div class="text-muted mt-8" style="font-size:.8rem">${formatDate(t.Created_At)}</div>
                </div>
            `).join('');
        } catch (err) {
            console.error(err);
        }
    }
</script>
</body>
</html>
