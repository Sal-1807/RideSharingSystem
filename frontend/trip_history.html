<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip History – RideShare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-brand">
        <h2>RideShare</h2>
        <p id="nav-user-name"></p>
    </div>
    <nav class="sidebar-nav">
        <a href="passenger_dashboard.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Dashboard
        </a>
        <a href="request_ride.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            Book Ride
        </a>
        <a href="trip_history.html" class="sidebar-link active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Trip History
        </a>
        <a href="payment.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            Payments
        </a>
        <a href="rating.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            Rate Driver
        </a>
        <a href="support_ticket.html" class="sidebar-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Support
        </a>
    </nav>
    <div class="sidebar-footer">
        <button onclick="logout()" class="sidebar-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
        </button>
    </div>
</aside>

<main class="main-content">
    <div class="main-header">
        <h1>Trip History</h1>
        <p>All your rides — completed, ongoing, and cancelled.</p>
    </div>

    <div id="alert-box" class="alert"></div>

    <div class="stats-grid mb-24">
        <div class="stat-card blue">
            <div class="stat-body">
                <div class="stat-label">Total Trips</div>
                <div class="stat-number" id="total-trips">—</div>
            </div>
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            </div>
        </div>
        <div class="stat-card green">
            <div class="stat-body">
                <div class="stat-label">Completed</div>
                <div class="stat-number" id="completed-trips">—</div>
            </div>
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
        </div>
        <div class="stat-card orange">
            <div class="stat-body">
                <div class="stat-label">Ongoing</div>
                <div class="stat-number" id="ongoing-trips">—</div>
            </div>
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-body">
                <div class="stat-label">Total Spent</div>
                <div class="stat-number" id="total-spent">₹—</div>
            </div>
            <div class="stat-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title" style="margin-bottom:0">All Trips</div>
            <input type="text" id="search" placeholder="Search driver or location…"
                   onkeyup="filterTrips()" class="no-icon" style="width:220px;padding:7px 12px;font-size:.85rem">
        </div>
        <div class="table-wrapper" id="trips-table">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </div>
</main>

<script src="js/api.js"></script>
<script>
    const user = requireAuth(['passenger']);
    let allTrips = [];

    if (user) {
        populateNav(user);
        loadTrips();
    }

    async function loadTrips() {
        try {
            allTrips = await API.passenger.trips(user.id);

            const completed = allTrips.filter(t => t.Status === 'Completed');
            const ongoing   = allTrips.filter(t => t.Status === 'Ongoing');
            const spent     = completed.reduce((s, t) => s + (parseFloat(t.Fare) || 0), 0);

            document.getElementById('total-trips').textContent     = allTrips.length;
            document.getElementById('completed-trips').textContent = completed.length;
            document.getElementById('ongoing-trips').textContent   = ongoing.length;
            document.getElementById('total-spent').textContent     = `₹${spent.toFixed(2)}`;

            renderTrips(allTrips);
        } catch (err) {
            showAlert('Error loading trips: ' + err.message, 'error');
        }
    }

    function renderTrips(trips) {
        const container = document.getElementById('trips-table');
        if (!trips.length) {
            container.innerHTML = '<div class="empty-state"><div class="icon">🚗</div><p>No trips yet. <a href="request_ride.html">Book your first ride!</a></p></div>';
            return;
        }
        container.innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Trip #</th>
                        <th>From → To</th>
                        <th>Driver</th>
                        <th>Distance</th>
                        <th>Fare</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    ${trips.map(t => `
                        <tr>
                            <td><strong>#${t.Trip_ID}</strong></td>
                            <td style="font-size:.82rem">
                                <span style="color:var(--success)">●</span> ${t.Pickup_Address}<br>
                                <span style="color:var(--danger)">●</span> ${t.Drop_Address}
                            </td>
                            <td>${t.Driver_Name}<br><small class="text-muted">${t.Driver_Phone}</small></td>
                            <td>${t.Distance ? t.Distance + ' km' : '—'}</td>
                            <td><strong>${t.Fare ? '₹' + t.Fare : '—'}</strong></td>
                            <td style="font-size:.82rem">${formatDate(t.Start_Time)}</td>
                            <td>${statusBadge(t.Status)}</td>
                            <td style="white-space:nowrap">
                                ${t.Status === 'Completed' && !t.Has_Paid
                                    ? `<a href="payment.html?trip=${t.Trip_ID}&fare=${t.Fare}&driver=${encodeURIComponent(t.Driver_Name)}" class="btn btn-success btn-sm" style="margin-right:4px">Pay</a>`
                                    : t.Has_Paid ? `<span class="badge badge-success" style="margin-right:4px">Paid</span>` : ''}
                                ${t.Status === 'Completed' && !t.Has_Rated
                                    ? `<a href="rating.html?trip=${t.Trip_ID}&driver_id=${t.Driver_ID || ''}" class="btn btn-outline btn-sm">Rate</a>`
                                    : t.Has_Rated ? `<span class="badge badge-info">Rated</span>` : ''}
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
    }

    function filterTrips() {
        const q = document.getElementById('search').value.toLowerCase();
        const filtered = allTrips.filter(t =>
            (t.Driver_Name    || '').toLowerCase().includes(q) ||
            (t.Pickup_Address || '').toLowerCase().includes(q) ||
            (t.Drop_Address   || '').toLowerCase().includes(q)
        );
        renderTrips(filtered);
    }
</script>
</body>
</html>
