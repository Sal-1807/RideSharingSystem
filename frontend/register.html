<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – RideShare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card" style="max-width:520px">

        <div class="auth-logo">
            <h2>Create Account</h2>
            <p>Join RideShare today</p>
        </div>

        <div id="alert-box" class="alert"></div>

        <form id="register-form" onsubmit="handleRegister(event)">

            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="reg-name" placeholder="John Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                    </svg>
                    <input type="email" id="reg-email" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.45 2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.56a16 16 0 0 0 6.53 6.53l1.41-1.41a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>
                    <input type="tel" id="reg-phone" placeholder="+91 98765 43210" required>
                </div>
            </div>

            <div class="form-group">
                <label>User Type</label>
                <select id="reg-type" class="no-icon" onchange="toggleDriverFields()">
                    <option value="passenger">Passenger</option>
                    <option value="driver">Driver</option>
                </select>
            </div>

            <!-- Driver-specific fields -->
            <div id="driver-fields" class="hidden">
                <div class="form-group">
                    <label>Driving License Number</label>
                    <input type="text" id="reg-license" class="no-icon" placeholder="DL12345">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Vehicle Model</label>
                        <input type="text" id="reg-vehicle" class="no-icon" placeholder="Swift Dzire">
                    </div>
                    <div class="form-group">
                        <label>Registration No.</label>
                        <input type="text" id="reg-regno" class="no-icon" placeholder="TS09AB1234">
                    </div>
                </div>
                <div class="form-group">
                    <label>Vehicle Type</label>
                    <select id="reg-vtype" class="no-icon">
                        <option value="">Loading…</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="reg-password" placeholder="••••••••" required minlength="6">
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="reg-confirm" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="reg-btn">Create Account</button>
        </form>

        <div class="auth-switch">Already have an account? <a href="login.html">Sign in</a></div>
        <div class="auth-switch mt-8"><a href="index.html">← Back to Home</a></div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    redirectIfLoggedIn();
    loadVehicleTypes();

    async function loadVehicleTypes() {
        try {
            const types = await API.locations.vehicleTypes();
            const select = document.getElementById('reg-vtype');
            select.innerHTML = types.map(t =>
                `<option value="${t.Vehicle_Type_ID}">${t.Type_Name} — ₹${t.Price_Per_KM}/km (min ₹${t.Min_Fare})</option>`
            ).join('');
        } catch (_) {}
    }

    function toggleDriverFields() {
        const type = document.getElementById('reg-type').value;
        document.getElementById('driver-fields').classList.toggle('hidden', type !== 'driver');
        document.getElementById('reg-btn').textContent =
            type === 'driver' ? 'Register as Driver' : 'Create Account';
    }

    async function handleRegister(e) {
        e.preventDefault();
        const type     = document.getElementById('reg-type').value;
        const name     = document.getElementById('reg-name').value.trim();
        const email    = document.getElementById('reg-email').value.trim();
        const phone    = document.getElementById('reg-phone').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirm  = document.getElementById('reg-confirm').value;
        const btn      = document.getElementById('reg-btn');

        if (password !== confirm) return showAlert('Passwords do not match!', 'error');

        btn.textContent = 'Registering…';
        btn.disabled = true;

        try {
            let data;
            if (type === 'passenger') {
                data = await API.auth.registerPassenger({ name, phone, email, password });
            } else {
                const license_no      = document.getElementById('reg-license').value.trim();
                const vehicle_model   = document.getElementById('reg-vehicle').value.trim();
                const registration_no = document.getElementById('reg-regno').value.trim();
                const vehicle_type_id = document.getElementById('reg-vtype').value;
                data = await API.auth.registerDriver({
                    name, phone, email, license_no, vehicle_model,
                    registration_no, vehicle_type_id, password
                });
            }
            showAlert(data.message + ' Redirecting to login…', 'success');
            setTimeout(() => window.location.href = '/login.html', 1500);

        } catch (err) {
            showAlert(err.message, 'error');
            btn.textContent = type === 'driver' ? 'Register as Driver' : 'Create Account';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
