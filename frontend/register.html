<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – RideShare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card" style="max-width:520px">

        <div class="auth-logo">
            <h1>🚗 Ride<span>Share</span></h1>
            <p>Create your account</p>
        </div>

        <!-- Register as Passenger or Driver -->
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="showForm('passenger', this)">🧑 Passenger</button>
            <button class="auth-tab"        onclick="showForm('driver', this)">🚖 Driver</button>
        </div>

        <div id="alert-box" class="alert"></div>

        <!-- ── Passenger Registration Form ── -->
        <form id="passenger-form" onsubmit="registerPassenger(event)">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="p-name" placeholder="Aarav Sharma" required>
                </div>
                <div class="form-group">
                    <label>Phone *</label>
                    <input type="tel" id="p-phone" placeholder="9876543210" required>
                </div>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="p-email" placeholder="aarav@gmail.com" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="p-password" placeholder="Min 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm Password *</label>
                    <input type="password" id="p-confirm" placeholder="Repeat password" required>
                </div>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block" id="p-btn">
                    🚀 Register as Passenger
                </button>
            </div>
            <p class="text-muted text-center" style="font-size:0.8rem">
                ✅ A welcome wallet of <strong>₹500</strong> will be added automatically!
            </p>
        </form>

        <!-- ── Driver Registration Form ── -->
        <form id="driver-form" onsubmit="registerDriver(event)" class="hidden">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="d-name" placeholder="Suresh Kumar" required>
                </div>
                <div class="form-group">
                    <label>Phone *</label>
                    <input type="tel" id="d-phone" placeholder="9000011111" required>
                </div>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="d-email" placeholder="suresh@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Driving License Number *</label>
                <input type="text" id="d-license" placeholder="DL12345" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Vehicle Model</label>
                    <input type="text" id="d-vehicle" placeholder="Swift Dzire">
                </div>
                <div class="form-group">
                    <label>Registration No.</label>
                    <input type="text" id="d-regno" placeholder="TS09AB1234">
                </div>
            </div>
            <div class="form-group">
                <label>Vehicle Type</label>
                <select id="d-type">
                    <option value="1">Sedan</option>
                    <option value="2">SUV</option>
                    <option value="3">Mini</option>
                    <option value="4">Auto</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="d-password" placeholder="Min 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm Password *</label>
                    <input type="password" id="d-confirm" placeholder="Repeat password" required>
                </div>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-success btn-block" id="d-btn">
                    🚖 Register as Driver
                </button>
            </div>
        </form>

        <div class="auth-switch">
            Already have an account? <a href="login.html">Login here</a>
        </div>
        <div class="auth-switch mt-8">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    redirectIfLoggedIn();

    function showForm(type, btn) {
        document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('passenger-form').classList.toggle('hidden', type !== 'passenger');
        document.getElementById('driver-form').classList.toggle('hidden', type !== 'driver');
    }

    async function registerPassenger(e) {
        e.preventDefault();
        const name     = document.getElementById('p-name').value.trim();
        const phone    = document.getElementById('p-phone').value.trim();
        const email    = document.getElementById('p-email').value.trim();
        const password = document.getElementById('p-password').value;
        const confirm  = document.getElementById('p-confirm').value;
        const btn      = document.getElementById('p-btn');

        if (password !== confirm)
            return showAlert('Passwords do not match!', 'error');

        btn.textContent = 'Registering…';
        btn.disabled = true;

        try {
            const data = await API.auth.registerPassenger({ name, phone, email, password });
            showAlert(data.message + ' Redirecting to login…', 'success');
            setTimeout(() => window.location.href = '/login.html', 1500);
        } catch (err) {
            showAlert(err.message, 'error');
            btn.textContent = '🚀 Register as Passenger';
            btn.disabled = false;
        }
    }

    async function registerDriver(e) {
        e.preventDefault();
        const name            = document.getElementById('d-name').value.trim();
        const phone           = document.getElementById('d-phone').value.trim();
        const email           = document.getElementById('d-email').value.trim();
        const license_no      = document.getElementById('d-license').value.trim();
        const vehicle_model   = document.getElementById('d-vehicle').value.trim();
        const registration_no = document.getElementById('d-regno').value.trim();
        const vehicle_type_id = document.getElementById('d-type').value;
        const password        = document.getElementById('d-password').value;
        const confirm         = document.getElementById('d-confirm').value;
        const btn             = document.getElementById('d-btn');

        if (password !== confirm)
            return showAlert('Passwords do not match!', 'error');

        btn.textContent = 'Registering…';
        btn.disabled = true;

        try {
            const data = await API.auth.registerDriver({
                name, phone, email, license_no, vehicle_model,
                registration_no, vehicle_type_id, password
            });
            showAlert(data.message + ' Redirecting to login…', 'success');
            setTimeout(() => window.location.href = '/login.html', 1500);
        } catch (err) {
            showAlert(err.message, 'error');
            btn.textContent = '🚖 Register as Driver';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
