<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – RideShare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">

        <div class="auth-logo">
            <h2>RideShare</h2>
            <p>Sign in to your account</p>
        </div>

        <div id="alert-box" class="alert"></div>

        <form id="login-form" onsubmit="handleLogin(event)">

            <div class="form-group">
                <label>User Type</label>
                <select id="login-type" class="no-icon" onchange="onTypeChange()">
                    <option value="passenger">Passenger</option>
                    <option value="driver">Driver</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email or Phone</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="email" placeholder="you@example.com or +91 98765 43210" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="auth-row">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
        </form>

        <div id="admin-hint" class="text-muted text-center hidden" style="font-size:.8rem;margin-top:12px;">
            Default admin: <code>admin@rideshare.com</code> / <code>admin123</code>
        </div>

        <div class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></div>
        <div class="auth-switch mt-8"><a href="index.html">← Back to Home</a></div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    redirectIfLoggedIn();

    function onTypeChange() {
        const type = document.getElementById('login-type').value;
        document.getElementById('admin-hint').classList.toggle('hidden', type !== 'admin');
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email        = document.getElementById('email').value.trim();
        const password     = document.getElementById('password').value;
        const selectedType = document.getElementById('login-type').value;
        const btn          = document.getElementById('login-btn');

        btn.textContent = 'Signing in…';
        btn.disabled = true;

        try {
            const data = await API.auth.login({ email, password, user_type: selectedType });

            saveUser({ id: data.user_id, name: data.name, user_type: data.user_type });
            showAlert(`Welcome back, ${data.name}! Redirecting…`, 'success');

            setTimeout(() => {
                if (data.user_type === 'passenger')   window.location.href = '/passenger_dashboard.html';
                else if (data.user_type === 'driver') window.location.href = '/driver_dashboard.html';
                else if (data.user_type === 'admin')  window.location.href = '/admin_dashboard.html';
            }, 800);

        } catch (err) {
            showAlert(err.message, 'error');
            btn.textContent = 'Sign In';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
