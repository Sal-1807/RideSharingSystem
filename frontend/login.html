<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – RideShare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">

        <div class="auth-logo">
            <h1>🚗 Ride<span>Share</span></h1>
            <p>Sign in to your account</p>
        </div>

        <!-- User type tabs -->
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="setType('passenger', this)">🧑 Passenger</button>
            <button class="auth-tab"        onclick="setType('driver', this)">🚖 Driver</button>
            <button class="auth-tab"        onclick="setType('admin', this)">🛡️ Admin</button>
        </div>

        <!-- Alert box -->
        <div id="alert-box" class="alert"></div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email / Contact</label>
                <input type="text" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                    🔑 Login
                </button>
            </div>
        </form>

        <!-- Admin hint -->
        <div id="admin-hint" class="text-muted text-center hidden" style="font-size:0.8rem;margin-top:8px;">
            Default admin: <code>admin@rideshare.com</code> / <code>admin123</code>
        </div>

        <div class="auth-switch">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
        <div class="auth-switch mt-8">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    redirectIfLoggedIn();  // redirect if already logged in

    let selectedType = 'passenger';

    function setType(type, btn) {
        selectedType = type;
        document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const hint = document.getElementById('admin-hint');
        if (type === 'admin') hint.classList.remove('hidden');
        else                  hint.classList.add('hidden');
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn      = document.getElementById('login-btn');

        btn.textContent = 'Logging in…';
        btn.disabled = true;

        try {
            const data = await API.auth.login({
                email,
                password,
                user_type: selectedType
            });

            // Save user to localStorage
            saveUser({
                id:        data.user_id,
                name:      data.name,
                user_type: data.user_type
            });

            showAlert(`Welcome back, ${data.name}! Redirecting…`, 'success');

            // Redirect based on role
            setTimeout(() => {
                if (data.user_type === 'passenger')      window.location.href = '/passenger_dashboard.html';
                else if (data.user_type === 'driver')    window.location.href = '/driver_dashboard.html';
                else if (data.user_type === 'admin')     window.location.href = '/admin_dashboard.html';
            }, 800);

        } catch (err) {
            showAlert(err.message, 'error');
            btn.textContent = '🔑 Login';
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
